; ═══════════════════════════════════════════════════════════════════════════
;  StarfieldPauseLODHold — settings
; ═══════════════════════════════════════════════════════════════════════════
;
;  The fix is on by default and there is nothing you need to change in here.
;  Install it, play normally, done.
;
;  What it does: while the pause menu is open, Starfield keeps running its
;  texture/mesh detail controller — promoting and demoting LODs based on a
;  stationary camera. This plugin stops that work while you are paused and
;  hands the controller back untouched when you unpause.
;
;  REQUIRES the Address Library for your Starfield version, i.e. a file named
;  versionlib-1-16-xxx-0.bin in Data\SFSE\Plugins. Without it this plugin
;  disables itself and does nothing at all — it will not break anything, but
;  you also will not get the fix. The log says so plainly on the first line if
;  that happens.
;
;  If something goes wrong, or you want to help: set bLogTimeline = 1 at the
;  bottom of this file, reproduce it once, and attach
;  Data\SFSE\Plugins\StarfieldPauseLODHold.log to a bug report.
;  The log is replaced on every launch; the run before your latest one is kept
;  as StarfieldPauseLODHold.prev.log.
; ═══════════════════════════════════════════════════════════════════════════


[General]
; Master switch. 0 = plugin loads but does nothing.
bEnabled = 1

; 1 = watch and log only, change nothing. Useful for a before/after comparison
; if you want to confirm the plugin is what made a difference.
bDryRun = 0


[Fix]
; While Starfield's pause menu is open, route every mesh/texture promotion,
; demotion and balance step through the engine's own state-reset transition
; instead of running it. The detail levels you can see do not change. On close,
; one reset discards the work the controller sampled from the paused camera and
; normal operation resumes immediately — there is no timed cooldown, and no
; engine memory is ever written.
bFreezeLODWhilePaused = 1


[Quit]
; FAST QUIT TO DESKTOP.
;
; When you quit, Starfield spends up to a minute tearing itself down — walking
; its whole heap and re-writing its shader cache — before the window closes.
; This closes the game immediately instead.
;
; It is safe: the only file that teardown writes is the D3D12 shader cache
; (Pipeline.cache), and the game only writes it when new shaders were compiled
; that session. This reads the game's own "needs saving" flag and closes
; instantly only when there is nothing to save — so the shader cache is never
; lost. The first time you play new content, that one exit runs normally to
; save the cache; every quit after is instant.
;
; Note for heavy load orders: this closes the process the moment you choose
; Quit to Desktop. If you run another SFSE plugin that writes its own data on
; exit (some co-save / persistence mods), set this to 0 so it can finish.
bFastExit = 1
;
; 1 = always close instantly, even when there are new shaders to save (they
; recompile next launch, causing brief stutter). Leave at 0 for the safe
; behaviour above.
bFastExitEvenIfCacheDirty = 0


[Safety]
; VRAM PRESSURE GATE — the fix for "it got worse the longer I played".
;
; While paused, the plugin stops the detail controller doing anything — which
; includes stopping it REDUCING texture detail. Reducing detail is the only way
; the game has of freeing VRAM. That costs nothing when there is memory to
; spare, but if you pause while the game is already short of it, that is a
; pause it could not use to recover, and the shortfall builds up over a session.
;
; So the freeze now only runs while the game is comfortable, and gets out of
; the way for the rest of a pause as soon as it is not.
;
; Only freeze at or below this budget level (0 = lots of VRAM free,
; 1 = light budgeting, 2 = real pressure, 3 = emergency). Raising this is not
; recommended — it is what caused the problem.
iMaxFreezeMode = 1
;
; ...and only with at least this much VRAM still free under the game's own
; texture target. Raise it if you still see gradual slowdown over a long
; session; set it to 0 to disable this half of the gate.
iMinFreezeHeadroomMB = 128


[Detection]
; Ask Starfield's own UI whether the pause menu is open. This is the only
; signal trusted to drive the fix; if it cannot be resolved for your game
; version the fix disables itself rather than guessing from the mouse cursor.
bUseEnginePauseMenu = 1

; Cursor heuristics. Diagnostics only — they can no longer enable the fix.
; Leave bUseCursorClip at 0: on a multi-monitor desktop it reads "menu open"
; during normal play.
bUseCursorVisible = 1
bUseCursorClip = 0
bRequireForeground = 1
iOpenDebounceMs = 300
iCloseDebounceMs = 150

; How often to check, in milliseconds. Lower reacts faster to a pause at a
; little more CPU cost. Clamped to 5-100.
iPollMs = 10


[Logging]
sLevel = info

; Detailed VRAM/LOD timeline. OFF by default: at 250 ms it writes roughly
; 10 MB and 52,000 lines per four hours of play. Turn it on only when you are
; capturing a bug report — it is exactly what makes a report useful.
bLogTimeline = 0
iTimelinePeriodMs = 250

; Heartbeat interval. This line prints even when nothing is happening, so a log
; that simply stops means the game process died rather than went idle. Raising
; it makes the log smaller and less precise about when things changed.
iSummaryIntervalMs = 15000

; Extremely noisy; needs sLevel = trace. Only if a developer asks.
bLogEveryCall = 0
